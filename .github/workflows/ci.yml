name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    env:
      # The suite runs against SQLite for speed. The schema is identical, and
      # the backend-postgres job below proves the PostgreSQL path works.
      DATABASE_URL: sqlite://
      JWT_SECRET: ci-secret
      SCHEDULER_ENABLED: "0"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        working-directory: backend
        run: python -m pytest -q

      - name: Check the app imports and builds a schema
        working-directory: backend
        run: |
          python -c "from app.main import app; print('routes:', len(app.routes))"
          python -c "from app.db import engine; from app.models import Base; Base.metadata.create_all(bind=engine); print('schema ok')"

  backend-postgres:
    name: Backend against PostgreSQL
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pulse
          POSTGRES_USER: pulse
          POSTGRES_PASSWORD: pulse
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U pulse -d pulse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://pulse:pulse@localhost:5432/pulse
      JWT_SECRET: ci-secret
      SCHEDULER_ENABLED: "0"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt psycopg[binary]

      - name: Create the schema on PostgreSQL
        working-directory: backend
        run: python -c "from app.db import engine; from app.models import Base; Base.metadata.create_all(bind=engine); print('postgres schema ok')"

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

      - name: Test
        run: npm test
